{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4 text-center">商家註冊</h3>
                <form method="POST">
                    <h5 class="fw-bold mb-3">負責人資訊</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">電話</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密碼</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <hr>
                    <h5 class="fw-bold mb-3">商家資訊</h5>
                    <div class="mb-3">
                        <label class="form-label">商家名稱</label>
                        <input type="text" class="form-control" name="shop_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">地址</label>
                        <input type="text" class="form-control" name="address">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">營業開始</label>
                            <input type="time" class="form-control" name="opening_time">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">營業結束</label>
                            <input type="time" class="form-control" name="closing_time">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">緯度</label>
                            <input type="number" step="any" class="form-control" name="latitude" placeholder="25.033">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">經度</label>
                            <input type="number" step="any" class="form-control" name="longitude" placeholder="121.565">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">建立商家帳號</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
