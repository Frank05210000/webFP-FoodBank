{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-lg-8">
        <h3 class="mb-4">購物車</h3>
        {% for fid, qty in items.items() %}
        {% set food = foods.get(fid|int) %}
        <div class="card mb-3 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">{{ food.name }}</h5>
                    <p class="text-muted small mb-0">數量：{{ qty }}</p>
                </div>
                <form method="POST" action="{{ url_for('remove_from_cart', food_id=fid) }}">
                    <button class="btn btn-outline-danger btn-sm">移除</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="mb-3">取貨時間</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">選擇時間 (30 分鐘區間)</label>
                        <input type="time" class="form-control" name="pickup_time" step="1800" required>
                        {% if shop and shop.closing_time %}
                            <small class="text-muted">營業至 {{ shop.closing_time.strftime('%H:%M') }}</small>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-success w-100">確認預訂</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
